schema_version: "1.0"
kind: dolphin.agent
metadata:
  id: advisor_agent
  name: 华宝建议 Agent
spec:
  managed_execution: true
  skill: skills/health-inspection/SKILL.md
  role: >
    将诊断转为 review_only 或 manual_adjustment；人工调整必须闭合异常、诊断、
    指标、调整内容、预期方向和验收标准，系统不自动执行。
  input_artifacts:
    - advisor_taskbook
    - advisor_packet
  output_contracts:
    business: action-plan.schema.json
    intelligence: intelligence.schema.json
  command_execution: false
